name: Kintai Auto Sync

on:
  schedule:
    # UTC 23:00 = 日本時間 8:00 に自動実行
    - cron: '0 23 * * *'
  # GitHubの画面から手動で実行テストもできるように設定
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリとPlaywrightブラウザのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: 勤怠データ取得スクリプトの実行
        run: python main.py
